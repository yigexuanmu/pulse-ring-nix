[package]
name = "pulse-ring"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
smithay-client-toolkit = { version = "0.21", features = ["system"] }
wayland-client = { version = "0.31", features = ["system"] }
cpal = "0.15"
realfft = "3.5"
rustfft = "6.4"
crossbeam-channel = "0.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
wayland-protocols = { version = "0.32.13", features = ["staging"] }
png = "0.18"
libc = "0.2.189"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
ab_glyph = "0.2.32"
rusttype = "0.9"
libloading = "0.9.0"
serde_json = "1"
fontdue = "0.9"
# Pure-Rust lyric fetch layer (replaces the bundled lyric_sources.py subprocess).
# ureq 2.x `tls` feature = rustls backend + embedded webpki-roots (Mozilla CA bundle
# baked into the binary), so HTTPS works with no SSL_CERT_FILE / cacert dependency.
ureq = { version = "2.12", features = ["tls"] }
base64 = "0.22"
# Reuse the same minor versions already pulled transitively (wgpu/naga) so no
# duplicate crates are compiled: quick-xml 0.41, regex 1.x, miniz_oxide 0.8
# (flate2's zlib backend, used to inflate NetEase KRC blobs).
quick-xml = "0.41"
regex = "1"
miniz_oxide = "0.8"

[dev-dependencies]
naga = "30.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
